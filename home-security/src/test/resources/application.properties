# Test Configuration for SecureHome Backend
spring.application.name=home-security-test

# Database Connection (defaults to local/CI MySQL test container)
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/home_security?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:testuser}
spring.datasource.password=${DB_PASSWORD:testpassword}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate for Tests
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Mock / Dummy GitHub OAuth credentials for CI test context initialization
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:dummy-test-client-id}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:dummy-test-client-secret}
spring.security.oauth2.client.registration.github.scope=read:user,user:email

logging.level.org.springframework.security=WARN
