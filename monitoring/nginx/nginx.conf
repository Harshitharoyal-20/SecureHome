# NGINX Reverse Proxy Configuration with Custom Domain & DuckDNS Support
events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Upstream services
    upstream frontend {
        server host.docker.internal:5173; # React / Vite Dev or Production
    }

    upstream backend {
        server host.docker.internal:8080; # Spring Boot Backend
    }

    upstream grafana {
        server grafana:3000;              # Grafana Monitoring Dashboard
    }

    # Redirect HTTP to HTTPS
    server {
        listen 80;
        server_name securehome.duckdns.org localhost;
        return 301 https://$host$request_uri;
    }

    # HTTPS Server (with Let's Encrypt / Custom SSL Certificate)
    server {
        listen 443 ssl;
        server_name securehome.duckdns.org localhost;

        # SSL Certificates (managed via Certbot / Let's Encrypt)
        # ssl_certificate     /etc/letsencrypt/live/securehome.duckdns.org/fullchain.pem;
        # ssl_certificate_key /etc/letsencrypt/live/securehome.duckdns.org/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Frontend Application Routing
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Backend API Routing
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Backend Actuator / Prometheus Metrics
        location /actuator/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Grafana Monitoring Dashboard Routing
        location /grafana/ {
            proxy_pass http://grafana;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
