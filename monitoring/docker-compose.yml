version: '3.8'

services:
  # =========================================================================
  # 1. PROMETHEUS: Time-Series Metrics Scraper & Database
  # =========================================================================
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: securehome-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - securehome-monitoring

  # =========================================================================
  # 2. GRAFANA: Visual Dashboards & Observability
  # =========================================================================
  grafana:
    image: grafana/grafana:10.4.0
    container_name: securehome-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/dashboards/securehome-dashboard.json
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - securehome-monitoring

  # =========================================================================
  # 3. DUCKDNS: Automated Dynamic DNS Subdomain Updater
  # =========================================================================
  duckdns:
    image: lscr.io/linuxserver/duckdns:latest
    container_name: securehome-duckdns
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
      - SUBDOMAINS=${DUCKDNS_SUBDOMAINS:-securehome}
      - TOKEN=${DUCKDNS_TOKEN:-your-duckdns-token-here}
      - UPDATE_IP=both
      - LOG_FILE=false
    networks:
      - securehome-monitoring

volumes:
  prometheus_data:
  grafana_data:

networks:
  securehome-monitoring:
    driver: bridge
